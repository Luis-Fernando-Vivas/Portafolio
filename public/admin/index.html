<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrador del blog — Automind</title>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml">
  <!-- Ruta absoluta: la página puede servirse como /admin o /admin/. -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <!-- Decap CMS: lee config.yml de esta misma carpeta. -->
  <script>window.CMS_MANUAL_INIT = true</script>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script>
    // En localhost el ingreso con Google usa las funciones locales (npm run
    // dev + .env) en vez de las del sitio publicado. Con `npm run cms`
    // corriendo, en cambio, Decap usa el backend local y no pide ingreso.
    var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    CMS.init(isLocal ? { config: { backend: { base_url: location.origin } } } : {})

    // Vista previa con los estilos del artículo publicado.
    CMS.registerPreviewStyle('/js/pricing.css')
    CMS.registerPreviewStyle('/js/font.css')
    CMS.registerPreviewStyle('/js/blog.css')

    // El ingreso es con Google (api/auth.js), aunque Decap guarde en GitHub:
    // se cambia el texto y el ícono de su botón "Iniciar sesión con GitHub".
    ;(function () {
      // Como <img>: los estilos de Decap pintan de un solo color los <svg>.
      var GOOGLE_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +
        '<path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>' +
        '<path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>' +
        '<path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>' +
        '<path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>'

      function relabel() {
        var buttons = document.querySelectorAll('button')
        for (var i = 0; i < buttons.length; i++) {
          var button = buttons[i]
          if (button.dataset.google || button.textContent.indexOf('GitHub') === -1) continue
          button.dataset.google = 'true'
          var walker = document.createTreeWalker(button, NodeFilter.SHOW_TEXT)
          var node
          while ((node = walker.nextNode())) node.nodeValue = node.nodeValue.replace('GitHub', 'Google')
          var icon = button.querySelector('svg')
          if (icon) icon.outerHTML = '<img src="data:image/svg+xml,' + encodeURIComponent(GOOGLE_SVG) + '" width="20" height="20" alt="" style="margin-right:12px">'
          button.style.background = '#ffffff'
          button.style.color = '#1f1f1f'
          button.style.border = '1px solid #dadce0'
        }
      }

      new MutationObserver(relabel).observe(document.body, { childList: true, subtree: true })
    })()
  </script>

  <!-- Etiqueta de estado en las tarjetas de la lista. El resumen de cada
       noticia (summary en config.yml) empieza con "📝 BORRADOR · " o "✅ ";
       aquí se quita ese prefijo del texto y se muestra como etiqueta con
       CSS. Solo se cambia el texto, no se agregan nodos, para no
       interferir con React. -->
  <style>
    [data-am-status]::before{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:999px;font:600 11px/1.6 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
    [data-am-status=draft]::before{content:'Borrador';background:#fff4d6;color:#8a5a00;border:1px solid #f0d58a}
    [data-am-status=published]::before{content:'Publicada';background:#e3f6ec;color:#16794a;border:1px solid #b5e3c9}
  </style>
  <script>
    ;(function () {
      var PREFIXES = [['📝 BORRADOR · ', 'draft'], ['✅ ', 'published']]

      function mark(node) {
        var text = node.nodeValue
        for (var i = 0; i < PREFIXES.length; i++) {
          if (text.indexOf(PREFIXES[i][0]) !== 0) continue
          node.parentNode.setAttribute('data-am-status', PREFIXES[i][1])
          node.nodeValue = text.slice(PREFIXES[i][0].length)
          return
        }
      }

      function scan(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
        var node
        while ((node = walker.nextNode())) {
          if (node.parentNode && node.parentNode.nodeType === 1) mark(node)
        }
      }

      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) {
          var record = records[i]
          if (record.type === 'characterData') mark(record.target)
          else for (var j = 0; j < record.addedNodes.length; j++) {
            var added = record.addedNodes[j]
            if (added.nodeType === 3 && added.parentNode) mark(added)
            else if (added.nodeType === 1) scan(added)
          }
        }
      }).observe(document.body, { childList: true, subtree: true, characterData: true })
    })()
  </script>

  <!-- Botón "IA": redacta noticias y traduce las existentes con Gemini
       (api/blog-ai.js). Todo lo que genera queda como borrador para
       revisarlo en el panel antes de publicar. -->
  <style>
    .am-ai-fab{position:fixed;right:24px;bottom:24px;z-index:9998;display:none;align-items:center;gap:8px;padding:12px 18px;border:0;border-radius:999px;background:#3a69c7;color:#fff;font:600 15px/1 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
    .am-ai-fab:hover{background:#2f57a8}
    .am-ai-fab[data-visible]{display:inline-flex}
    .am-ai-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,22,30,.5);font:15px/1.5 system-ui,sans-serif;color:#1a1a1a}
    .am-ai-overlay[data-open]{display:flex}
    .am-ai-modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
    .am-ai-modal h2{margin:0 0 4px;font-size:20px}
    .am-ai-modal p{margin:0 0 16px;color:#555;font-size:14px}
    .am-ai-tabs{display:flex;gap:4px;margin:16px 0;padding:4px;background:#eff0f4;border-radius:8px}
    .am-ai-tabs button{flex:1;padding:8px;border:0;border-radius:6px;background:none;font:inherit;font-size:14px;cursor:pointer}
    .am-ai-tabs button[aria-selected=true]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .am-ai-modal label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
    .am-ai-modal textarea,.am-ai-modal select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #dfdfe3;border-radius:6px;font:inherit;font-size:14px}
    .am-ai-modal textarea{min-height:90px;resize:vertical}
    .am-ai-langs{display:flex;gap:16px;margin-top:12px}
    .am-ai-langs label{display:flex;align-items:center;gap:6px;margin:0;font-weight:400}
    .am-ai-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .am-ai-actions button{padding:10px 16px;border-radius:6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
    .am-ai-cancel{border:1px solid #dfdfe3;background:#fff;color:#1a1a1a}
    .am-ai-submit{border:0;background:#3a69c7;color:#fff}
    .am-ai-submit:disabled{opacity:.6;cursor:wait}
    .am-ai-status{margin-top:16px;padding:12px;border-radius:6px;font-size:14px}
    .am-ai-status:empty{display:none}
    .am-ai-status[data-kind=busy]{background:#eef3fc;color:#2f57a8}
    .am-ai-status[data-kind=ok]{background:#e8f6ee;color:#1d6b3f}
    .am-ai-status[data-kind=error]{background:#fdecec;color:#a42323}
    .am-ai-status a{color:inherit;font-weight:600}
  </style>
  <button class="am-ai-fab" type="button">✨ IA</button>
  <div class="am-ai-overlay" role="dialog" aria-modal="true" aria-labelledby="am-ai-title">
    <form class="am-ai-modal">
      <h2 id="am-ai-title">Noticias con IA</h2>
      <p>Gemini busca en Google, redacta y traduce. Todo queda como <strong>borrador</strong> para que lo revises antes de publicar.</p>
      <div class="am-ai-tabs" role="tablist">
        <button type="button" role="tab" data-tab="generate" aria-selected="true">Nueva noticia</button>
        <button type="button" role="tab" data-tab="translate" aria-selected="false">Traducir existente</button>
      </div>
      <div data-panel="generate">
        <label for="am-ai-topic">Tema (opcional)</label>
        <textarea id="am-ai-topic" placeholder="Ej.: nuevas reglas de facturación electrónica de la DIAN. Si lo dejas vacío, la IA elige la noticia más relevante de los últimos días."></textarea>
      </div>
      <div data-panel="translate" hidden>
        <label for="am-ai-post">Noticia</label>
        <select id="am-ai-post"></select>
        <div class="am-ai-langs">
          <label><input type="checkbox" value="en"> Inglés</label>
          <label><input type="checkbox" value="fr"> Francés</label>
        </div>
      </div>
      <div class="am-ai-status" aria-live="polite"></div>
      <div class="am-ai-actions">
        <button class="am-ai-cancel" type="button">Cerrar</button>
        <button class="am-ai-submit" type="submit">Generar</button>
      </div>
    </form>
  </div>
  <script>
    ;(function () {
      var fab = document.querySelector('.am-ai-fab')
      var overlay = document.querySelector('.am-ai-overlay')
      var form = overlay.querySelector('form')
      var status = overlay.querySelector('.am-ai-status')
      var submit = overlay.querySelector('.am-ai-submit')
      var select = document.getElementById('am-ai-post')
      var langBoxes = overlay.querySelectorAll('.am-ai-langs input')
      var tab = 'generate'
      var posts = []
      var busy = false

      // Sesión de Decap. Con el backend local (npm run cms) no hay token y
      // la API escribe en disco; con Google, el token prueba el acceso.
      function session() {
        try {
          return JSON.parse(localStorage.getItem('decap-cms-user') || 'null')
        } catch (error) {
          return null
        }
      }

      setInterval(function () {
        if (session()) fab.setAttribute('data-visible', '')
        else fab.removeAttribute('data-visible')
      }, 1000)

      function api(body) {
        var user = session() || {}
        var headers = { 'Content-Type': 'application/json' }
        if (user.token && user.backendName !== 'proxy') headers.Authorization = 'Bearer ' + user.token
        return fetch('/api/blog-ai', { method: 'POST', headers: headers, body: JSON.stringify(body) }).then(function (response) {
          return response.json().catch(function () { return {} }).then(function (data) {
            if (!response.ok) throw new Error(data.error || 'Error ' + response.status)
            return data
          })
        })
      }

      function setStatus(kind, html) {
        status.setAttribute('data-kind', kind)
        status.innerHTML = html
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] })
      }

      // Decap no ve los commits hechos por fuera: se recarga al abrir la noticia.
      function entryLink(slug) {
        return '<a href="/admin/#/collections/blog/entries/' + encodeURIComponent(slug) + '" data-reload>Abrir en el panel</a>'
      }

      function selectTab(name) {
        tab = name
        overlay.querySelectorAll('[role=tab]').forEach(function (button) {
          button.setAttribute('aria-selected', String(button.dataset.tab === name))
        })
        overlay.querySelectorAll('[data-panel]').forEach(function (panel) {
          panel.hidden = panel.dataset.panel !== name
        })
        submit.textContent = name === 'generate' ? 'Generar' : 'Traducir'
        if (!busy) setStatus('', '')
        if (name === 'translate') loadPosts()
      }

      function loadPosts() {
        select.innerHTML = '<option>Cargando…</option>'
        api({ action: 'list' }).then(function (data) {
          posts = data.posts
          select.innerHTML = posts.map(function (post) {
            var missing = ['en', 'fr'].filter(function (lang) { return post.langs.indexOf(lang) === -1 })
            var note = missing.length ? ' — falta ' + missing.join(', ').toUpperCase() : ' — completa'
            return '<option value="' + escapeHtml(post.slug) + '">' + escapeHtml(post.title) + note + '</option>'
          }).join('')
          syncLangs()
        }).catch(function (error) {
          select.innerHTML = ''
          setStatus('error', escapeHtml(error.message))
        })
      }

      // Marca por defecto los idiomas que le faltan a la noticia elegida.
      function syncLangs() {
        var post = posts.filter(function (p) { return p.slug === select.value })[0]
        langBoxes.forEach(function (box) { box.checked = !!post && post.langs.indexOf(box.value) === -1 })
      }

      function open() {
        overlay.setAttribute('data-open', '')
        if (tab === 'translate') loadPosts()
      }

      function close() {
        if (!busy) overlay.removeAttribute('data-open')
      }

      fab.addEventListener('click', open)
      overlay.querySelector('.am-ai-cancel').addEventListener('click', close)
      overlay.addEventListener('click', function (event) {
        if (event.target === overlay) close()
        if (event.target.matches('a[data-reload]')) {
          event.preventDefault()
          location.href = event.target.href
          location.reload()
        }
      })
      overlay.querySelectorAll('[role=tab]').forEach(function (button) {
        button.addEventListener('click', function () { selectTab(button.dataset.tab) })
      })
      select.addEventListener('change', syncLangs)

      form.addEventListener('submit', function (event) {
        event.preventDefault()
        if (busy) return
        var request
        if (tab === 'generate') {
          request = { action: 'generate', topic: document.getElementById('am-ai-topic').value }
          setStatus('busy', 'Buscando la noticia, redactándola y traduciéndola… Puede tardar uno o dos minutos.')
        } else {
          var langs = [].filter.call(langBoxes, function (box) { return box.checked }).map(function (box) { return box.value })
          if (!select.value || !langs.length) return setStatus('error', 'Elige una noticia y al menos un idioma.')
          request = { action: 'translate', slug: select.value, langs: langs }
          setStatus('busy', 'Traduciendo… Puede tardar un minuto.')
        }
        busy = true
        submit.disabled = true
        api(request).then(function (data) {
          var done = tab === 'generate'
            ? 'Borrador creado: <strong>' + escapeHtml(data.title) + '</strong> (' + data.langs.join(', ').toUpperCase() + '). '
            : 'Traducción guardada (' + data.langs.join(', ').toUpperCase() + '). '
          setStatus('ok', done + 'Revísala, agrégale una portada y desmarca “Borrador” para publicarla. ' + entryLink(data.slug))
          if (tab === 'generate') document.getElementById('am-ai-topic').value = ''
          else loadPosts()
        }).catch(function (error) {
          setStatus('error', escapeHtml(error.message))
        }).then(function () {
          busy = false
          submit.disabled = false
        })
      })
    })()
  </script>
</body>
</html>
